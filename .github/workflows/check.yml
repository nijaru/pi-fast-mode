name: check

on:
  push:
    branches: [main, maintenance-20260912]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply maintenance patch
        if: github.ref == 'refs/heads/maintenance-20260912'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('extensions/index.ts')
          text = source.read_text()
          text = text.replace(
              'model.cost × the official rate-card multiplier (2.5x for GPT-6 Astra and\n * GPT-5.4) on terminal stream events.',
              'model.cost × the official Codex rate-card multiplier on terminal stream\n * events.',
          )
          text = text.replace('\n\t"openai-codex/gpt-5.4",', '')
          source.write_text(text)

          tests = Path('tests/fast-mode.test.ts')
          text = tests.read_text()
          needle = '''\ttest("non-listed model is rejected", () => {\n\t\texpect(isModelAllowed(codexModel("deepseek-v4-flash"), SPECS, filter)).toBe(false);\n\t});'''
          replacement = needle + '''\n\ttest("retired GPT-5.4 is not enabled by default", () => {\n\t\texpect(isModelAllowed(codexModel("gpt-5.4"), SPECS, filter)).toBe(false);\n\t});'''
          if 'retired GPT-5.4 is not enabled by default' not in text:
              if needle not in text:
                  raise SystemExit('fast-mode test insertion point not found')
              text = text.replace(needle, replacement)
          tests.write_text(text)

          agents = Path('AGENTS.md')
          text = agents.read_text().replace(
              'Fast mode serves the same GPT-6 Astra / GPT-5.6 / GPT-5.5 / GPT-5.4 models at higher speed for a credit multiplier.',
              'Fast mode serves the currently supported GPT-6 Astra / GPT-5.6 / GPT-5.5 Codex models at higher speed for a credit multiplier.',
          )
          agents.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              'Fast mode runs supported models at increased speed for a higher credit rate: 2.5x for GPT-6 Astra, GPT-5.6, and GPT-5.5, and 2x for GPT-5.4. OpenAI documents roughly 1.5x speed for the GPT-5.6/5.5/5.4 families; Astra\'s speedup is not separately published.',
              'Fast mode runs currently supported Codex models at increased speed for a higher credit rate: 2.5x for GPT-6 Astra, GPT-5.6, and GPT-5.5. OpenAI documents roughly 1.5x speed for the GPT-5.6/5.5 families; Astra\'s speedup is not separately published.',
          )
          text = text.replace('\n- `openai-codex/gpt-5.4`\n', '\n')
          text = text.replace(
              'Credit multipliers (rate card): 2.5x for GPT-6 Astra, GPT-5.6, and GPT-5.5; 2x for GPT-5.4. OpenAI retired `gpt-5.4` and `gpt-5.4-mini` from Codex (ChatGPT sign-in) on August 31, 2026 — replace `gpt-5.4` with `gpt-5.6-terra` and `gpt-5.4-mini` with `gpt-5.6-luna`. `gpt-5.4` stays in the defaults at 2x for accounts and API-key paths still serving it; `gpt-5.4-mini` was never added because OpenAI never confirmed fast-mode support for it.',
              'Credit multipliers (rate card): 2.5x for GPT-6 Astra, GPT-5.6, and GPT-5.5. OpenAI retired `gpt-5.4` and `gpt-5.4-mini` from Codex (ChatGPT sign-in) on August 31, 2026, so `gpt-5.4` is no longer a built-in default. Its historical 2x multiplier remains available for an explicit custom allowlist if a compatible endpoint still serves it.',
          )
          readme.write_text(text)
          PY
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: git diff --check
      - name: Commit maintenance changes
        if: github.ref == 'refs/heads/maintenance-20260912'
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add extensions/index.ts tests/fast-mode.test.ts README.md AGENTS.md
            git commit -m 'fix(fast-mode): drop retired GPT-5.4 default [skip ci]'
            git push
          fi
